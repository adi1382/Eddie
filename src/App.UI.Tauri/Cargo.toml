[workspace]
members = ["crates/eddie-engine", "src-tauri"]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["AirVPN <support@airvpn.org>"]
repository = "https://github.com/AirVPN/Eddie"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
